<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для моей принцесске <3</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --hot-pink: #ff1493; --deep-black: #0a0a0a; }
        body { background-color: var(--deep-black); color: white; font-family: 'Montserrat', sans-serif; margin: 0; overflow-x: hidden; }
        .heart { position: fixed; color: var(--hot-pink); font-size: 20px; z-index: 1000; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle, #1a1a1a 0%, var(--deep-black) 100%); border-bottom: 2px solid var(--hot-pink); }
        h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--hot-pink); margin: 0; }
        .date-badge { background: var(--hot-pink); color: black; padding: 5px 15px; border-radius: 50px; font-weight: bold; margin-bottom: 20px; }
        .main-text { font-size: 1.2rem; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 20px; border-left: 4px solid var(--hot-pink); max-width: 800px; margin: 50px auto; line-height: 1.6; text-align: center; }
        .gift-btn { padding: 15px 40px; background: transparent; border: 2px solid var(--hot-pink); color: var(--hot-pink); font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; font-size: 1rem; }
        .gift-btn:hover { background: var(--hot-pink); color: white; box-shadow: 0 0 20px var(--hot-pink); }
        .heart-trail { position: absolute; pointer-events: none; color: var(--hot-pink); animation: fadeUp 1s linear forwards; z-index: 9999; }
        @keyframes fadeUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(0.5); } }
        #giftModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; opacity: 0; transition: 0.5s; }
        img {
            width: 100%;
            height: 300px; 
            object-fit: cover; 
            border-radius: 10px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px var(--hot-pink);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="hearts-container"></div>
    <section class="hero">
        <div class="date-badge">12 мая 2026 • 00:00</div>
        <h1>От мишки)</h1>
        <div style="margin: 20px 0; letter-spacing: 2px; color: #888;">BAKU ❤️ 2200 KM ❤️ RUSSIA</div>
        <div id="timer" style="font-size: 1.2rem;">Мы вместе уже:<br><span id="countdown" style="color: var(--hot-pink); font-weight: bold; font-size: 2rem;">Загрузка...</span></div>
    </section>

    <div class="main-text">
        С того самого момента, как я написал тебе впервые, мой мир изменился. <br>
        Ты — моё счастье и моя любовь. Спасибо за каждый миг вместе! ❤️
        <br><br>
        <button class="gift-btn" onclick="openGift()">ОТКРЫТЬ ГЛАВНЫЙ ПОДАРОК</button>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; padding: 20px; max-width: 1100px; margin: 0 auto;">
        <img src="1.jpg"> <img src="2.jpg"> <img src="3.jpg"> <img src="4.jpg"> <img src="5.jpg">
        <img src="6.jpg"> <img src="7.jpg"> <img src="8.jpg"> <img src="9.jpg"> <img src="10.jpg">
    </div>

    <div id="giftModal">
        <div style="background: #1a1a1a; padding: 30px; border-radius: 20px; border: 2px solid var(--hot-pink); text-align: center; max-width: 400px;">
            <img src="main.jpg" style="margin-bottom: 20px;">
            <h2 style="color: var(--hot-pink);">Люблю тебя! ❤️</h2>
            <p>Ты мой самый ценный подарок!</p>
            <button onclick="closeGift()" style="padding: 10px 20px; cursor: pointer;">Закрыть</button>
        </div>
    </div>

    <div style="position: fixed; bottom: 20px; left: 20px; z-index: 9999;">
        <button onclick="document.getElementById('track').play()" style="background: var(--hot-pink); color: white; border: none; padding: 10px 15px; border-radius: 50px; cursor: pointer;">Музыка 🎵</button>
        <audio id="track" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <script>
        function updateTimer() {
            const start = new Date(2026, 1, 22);
            const now = new Date();
            const diff = now - start;
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff / 3600000) % 24);
            const m = Math.floor((diff / 60000) % 60);
            const s = Math.floor((diff / 1000) % 60);
            document.getElementById('countdown').innerHTML = d + "д " + h + "ч " + m + "м " + s + "с";
        }
        setInterval(updateTimer, 1000); updateTimer();

        function createHeart() {
            const h = document.createElement('div');
            h.className = 'heart'; h.innerHTML = '❤️';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.getElementById('hearts-container').appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }
        setInterval(createHeart, 400);

        function openGift() {
            const m = document.getElementById('giftModal');
            m.style.display = 'flex'; setTimeout(() => m.style.opacity = '1', 10);
            for(let i=0; i<50; i++) setTimeout(createHeart, i*50);
        }
        function closeGift() {
            const m = document.getElementById('giftModal');
            m.style.opacity = '0'; setTimeout(() => m.style.display = 'none', 500);
        }

        document.addEventListener('mousemove', (e) => {
            const t = document.createElement('div');
            t.className = 'heart-trail'; t.innerHTML = '❤️';
            t.style.left = e.pageX + 'px'; t.style.top = e.pageY + 'px';
            document.body.appendChild(t); setTimeout(() => t.remove(), 1000);
        });
    </script>
</body>
</html>
